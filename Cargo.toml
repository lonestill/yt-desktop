[package]
name = "yt-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["mac-proxy"] }
muda = "0.21"
dirs = "6.0"
http = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "sync", "time", "macros"] }
