name: Build & Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build Universal tpws engine
        run: |
          cd tpws
          make mac
          lipo -info tpws

      - name: Build release binary
        run: |
          cargo build --release

      - name: Assemble macOS Bundle
        run: |
          chmod +x build_app.sh
          ./build_app.sh

      - name: Create DMG & ZIP
        run: |
          hdiutil create -volname "YouTube" -srcfolder YouTube.app -ov -format UDZO YouTube-macOS.dmg
          zip -r YouTube-macOS.zip YouTube.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            YouTube-macOS.dmg
            YouTube-macOS.zip

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            zlib1g-dev \
            gcc \
            make

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build native tpws engine
        run: |
          cd tpws
          make
          strip tpws

      - name: Build release binary
        run: |
          cargo build --release

      - name: Package Linux Archive
        run: |
          mkdir -p staging
          cp target/release/yt-desktop staging/
          cp tpws/tpws staging/
          cp assets/icon.png staging/
          chmod +x staging/yt-desktop staging/tpws
          tar -czvf YouTube-Linux-x64.tar.gz -C staging .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: YouTube-Linux-x64.tar.gz

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: |
          cargo build --release

      - name: Download ByeDPI (ciadpi.exe)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/hufrea/byedpi/releases/download/v0.17.3/byedpi-17.3-x86_64-w64.zip" -OutFile "byedpi.zip"
          Expand-Archive -Path "byedpi.zip" -DestinationPath "byedpi_dist"

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/release/yt-desktop.exe" -Destination "staging/"
          Copy-Item "byedpi_dist/ciadpi.exe" -Destination "staging/"
          Copy-Item "assets/icon.png" -Destination "staging/"
          Compress-Archive -Path "staging/*" -DestinationPath "YouTube-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: YouTube-Windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest Automated Build' }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: |
            artifacts/YouTube-macOS.dmg
            artifacts/YouTube-macOS.zip
            artifacts/YouTube-Linux-x64.tar.gz
            artifacts/YouTube-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
